<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <!-- Simple high-contrast ruler icon -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#e0d8c8"/>
    </linearGradient>
  </defs>
  <!-- Background plate -->
  <rect x="8" y="40" width="112" height="48" rx="4" ry="4"
        fill="url(#body)" stroke="#2a2a2a" stroke-width="2.5"/>
  <!-- Major cm ticks -->
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="40" x2="16" y2="72"/>
    <line x1="32" y1="40" x2="32" y2="64"/>
    <line x1="48" y1="40" x2="48" y2="72"/>
    <line x1="64" y1="40" x2="64" y2="64"/>
    <line x1="80" y1="40" x2="80" y2="72"/>
    <line x1="96" y1="40" x2="96" y2="64"/>
    <line x1="112" y1="40" x2="112" y2="72"/>
  </g>
  <!-- Minor mm ticks -->
  <g stroke="#3a3a3a" stroke-width="1.2" stroke-linecap="round">
    <line x1="20" y1="40" x2="20" y2="52"/>
    <line x1="24" y1="40" x2="24" y2="56"/>
    <line x1="28" y1="40" x2="28" y2="52"/>
    <line x1="36" y1="40" x2="36" y2="52"/>
    <line x1="40" y1="40" x2="40" y2="56"/>
    <line x1="44" y1="40" x2="44" y2="52"/>
    <line x1="52" y1="40" x2="52" y2="52"/>
    <line x1="56" y1="40" x2="56" y2="56"/>
    <line x1="60" y1="40" x2="60" y2="52"/>
    <line x1="68" y1="40" x2="68" y2="52"/>
    <line x1="72" y1="40" x2="72" y2="56"/>
    <line x1="76" y1="40" x2="76" y2="52"/>
    <line x1="84" y1="40" x2="84" y2="52"/>
    <line x1="88" y1="40" x2="88" y2="56"/>
    <line x1="92" y1="40" x2="92" y2="52"/>
    <line x1="100" y1="40" x2="100" y2="52"/>
    <line x1="104" y1="40" x2="104" y2="56"/>
    <line x1="108" y1="40" x2="108" y2="52"/>
  </g>
  <!-- Zero accent -->
  <circle cx="16" cy="80" r="3.5" fill="#c0392b"/>
</svg>
